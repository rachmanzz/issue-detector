name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # keyless signing (build provenance)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              out="dist/issue-detector_${os}_${arch}${ext}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/issue-detector
            done
          done

      - name: Generate SBOM (Go module inventory per binary)
        run: |
          for b in dist/issue-detector_*; do
            { echo "# SBOM (Go build info) for $(basename "$b")"; go version -m "$b"; } > "$b.sbom.txt"
          done

      - name: Checksums
        run: (cd dist && sha256sum issue-detector_* > checksums.txt)

      - name: Sign build provenance (keyless)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/issue-detector_*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/issue-detector_* dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
