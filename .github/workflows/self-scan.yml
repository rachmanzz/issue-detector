name: self-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o issue-detector ./cmd/issue-detector

      - name: Self-scan (harus bersih terhadap baseline)
        run: >
          ./issue-detector scan . --no-deps --no-adapters
          --ignore internal/testdata/**
          --baseline .issue-detector-selfscan-baseline.json
          --fail-on high

      - name: Regenerasi baseline bila ada temuan baru (manual)
        if: failure()
        run: |
          echo "Ada temuan baru di atas baseline. Regenerasi:"
          echo "  ./issue-detector baseline . -o .issue-detector-selfscan-baseline.json --ignore internal/testdata/** --no-deps --no-adapters"
          echo "Review fingerprint lalu commit baseline baru."